<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>喃字 KTV 小灰熊字幕製作系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @font-face {
      font-family: 'NomFont';
      src: local('NomNaTong-Regular'), local('NomNaTong');
    }
    .font-nom {
      font-family: 'UserNomFont', 'NomFont', 'HAN NOM A', 'HAN NOM B', serif, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tap-btn-active {
      transform: scale(0.97);
      filter: brightness(1.25);
    }
    .touch-friendly {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col select-none overflow-x-hidden touch-friendly">

  <!-- 媒體播放核心 (MP4 影片 / MP3 音訊) -->
  <video id="mediaPlayer" class="hidden" playsinline preload="auto" crossorigin="anonymous"></video>

  <!-- 頂部導航列：移除檔案名稱，按鈕依序往左移靠齊，明確標註「下載」 -->
  <header class="bg-slate-900 border-b border-slate-800 px-3 sm:px-4 py-2.5 sticky top-0 z-40 flex items-center justify-between shadow-lg">
    <!-- 左側群組：Logo + 狀態指示 + 檔案 + 儲存 + 下載/輸出 + 切換 -->
    <div class="flex items-center space-x-2 sm:space-x-2.5 overflow-x-auto no-scrollbar py-0.5">
      <!-- Logo -->
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 via-rose-500 to-pink-500 flex items-center justify-center text-white font-bold shadow-md shadow-amber-500/20 shrink-0">
        <i class="fa-solid fa-microphone-lines text-base"></i>
      </div>

      <!-- 已儲存狀態標籤 -->
      <span id="saveStatusIndicator" class="text-[10px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-lg flex items-center gap-1.5 font-mono shrink-0">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>已儲存
      </span>

      <!-- 檔案 -->
      <button id="btnOpenProjectsModal" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold border border-slate-700 text-cyan-300 transition flex items-center gap-1.5 shadow-sm shrink-0">
        <i class="fa-solid fa-folder-tree text-[11px]"></i>
        <span>檔案</span>
      </button>

      <!-- 儲存 -->
      <button id="btnManualSave" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow-md shadow-blue-600/30 transition flex items-center gap-1.5 shrink-0">
        <i class="fa-solid fa-floppy-disk text-[11px]"></i>
        <span>儲存</span>
      </button>

      <!-- 下載 / 輸出按鈕 (特別加亮引導) -->
      <button id="btnOpenExportModal" class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold shadow-md shadow-emerald-700/30 transition flex items-center gap-1.5 shrink-0">
        <i class="fa-solid fa-cloud-arrow-down text-[12px]"></i>
        <span>下載 / 輸出</span>
      </button>

      <!-- 切換按鈕：僅顯示「切換」二字 -->
      <button id="btnQuickSwitchProject" class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white text-xs font-bold transition flex items-center gap-1.5 shrink-0 shadow-md shadow-purple-600/30">
        <i class="fa-solid fa-repeat text-[11px]"></i>
        <span id="switchModeBtnText">切換</span>
      </button>
    </div>

    <!-- 右側當前模式徽章 -->
    <div class="hidden md:flex items-center text-[11px] font-medium">
      <span id="currentModeBadge" class="bg-slate-800/90 text-cyan-300 border border-slate-700/80 px-2.5 py-1 rounded-lg flex items-center gap-1.5">
        <i class="fa-solid fa-language text-amber-400"></i>
        <span id="currentModeBadgeText">喃字 KTV 模式</span>
      </span>
    </div>
  </header>

  <!-- 主工作視窗 -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
    
    <!-- 左側面板：素材、歌詞、4 組 RGB 面板與【直接下載專區】 (4 欄寬) -->
    <section class="lg:col-span-4 flex flex-col space-y-4">
      
      <!-- 1. 媒體與字型載入 -->
      <div class="bg-slate-900/90 backdrop-blur rounded-2xl p-4 border border-slate-800 shadow-sm space-y-3">
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-2">
          <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-film text-amber-400"></i> 1. 素材與 MP4 MV
          </h2>
          <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20 font-mono">
            長度不限
          </span>
        </div>

        <div>
          <label class="text-xs text-slate-400 mb-1 block font-medium">上傳歌曲 MP4 影片或 MP3 音訊檔</label>
          <input type="file" id="mediaFileInput" accept="video/mp4,video/webm,video/mkv,audio/*" class="hidden">
          <button onclick="document.getElementById('mediaFileInput').click()" class="w-full py-2.5 px-3 rounded-xl border border-dashed border-slate-700 hover:border-amber-500/60 bg-slate-950/60 hover:bg-slate-800/50 text-xs text-slate-300 flex items-center justify-between transition group">
            <span id="mediaFileName" class="truncate max-w-[190px] text-slate-400">選擇 MP4 或音訊...</span>
            <span class="bg-slate-800 group-hover:bg-amber-500 group-hover:text-slate-950 text-slate-300 text-[10px] px-2 py-1 rounded-md transition font-semibold">選擇檔案</span>
          </button>
        </div>

        <div id="fontUploaderContainer">
          <label class="text-xs text-slate-400 mb-1 block font-medium flex items-center justify-between">
            <span>載入喃字字型 (NomNaTong-Regular.ttf)</span>
            <span id="fontStatusBadge" class="text-[10px] text-amber-400 bg-amber-500/10 px-1.5 py-0.5 rounded border border-amber-500/20">系統預設</span>
          </label>
          <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" class="hidden">
          <button onclick="document.getElementById('fontFileInput').click()" class="w-full py-2.5 px-3 rounded-xl border border-dashed border-slate-700 hover:border-cyan-500/60 bg-slate-950/60 hover:bg-slate-800/50 text-xs text-slate-300 flex items-center justify-between transition group">
            <span id="fontFileName" class="truncate max-w-[190px] text-slate-400">載入 NomNaTong-Regular.ttf</span>
            <span class="bg-slate-800 group-hover:bg-cyan-500 group-hover:text-slate-950 text-slate-300 text-[10px] px-2 py-1 rounded-md transition font-semibold">更換字型</span>
          </button>
        </div>
      </div>

      <!-- 2. 歌詞輸入 (支援喃字與 K-POP 韓文 + 標楷體中文翻譯) -->
      <div class="bg-slate-900/90 backdrop-blur rounded-2xl p-4 border border-slate-800 shadow-sm space-y-3">
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-2">
          <h2 id="lyricsSectionTitle" class="text-sm font-semibold text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-align-left text-rose-400"></i> 2. 喃字歌詞
          </h2>
          <button id="btnParseLyrics" class="text-xs bg-rose-500/20 hover:bg-rose-500 text-rose-300 hover:text-white px-2.5 py-1 rounded-lg transition font-medium border border-rose-500/30">
            解析分詞
          </button>
        </div>

        <div>
          <label id="lyricsInputLabel" class="text-xs text-slate-400 mb-1 block font-medium">主歌詞 (一行一句)：</label>
          <textarea id="rawLyricsInput" class="w-full h-20 p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs sm:text-sm font-nom text-slate-200 placeholder-slate-600 focus:outline-none focus:border-rose-500 transition leading-relaxed resize-none" placeholder="請貼上主歌詞，一行一句..."></textarea>
        </div>

        <!-- K-POP 專用：中文翻譯輸入區塊 (標楷體) -->
        <div id="translationInputGroup" class="hidden space-y-1 pt-1 border-t border-slate-800/60">
          <div class="flex items-center justify-between">
            <label class="text-xs text-amber-300 font-medium flex items-center gap-1.5">
              <span>♪ 中文翻譯 (左上方標楷體顯示，一行一句)：</span>
            </label>
            <span class="text-[10px] text-slate-500 font-mono">標楷體 DFKai
